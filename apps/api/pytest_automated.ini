[pytest]
testpaths = tests/automated
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short --strict-markers
markers =
    p0: P0 阻断级用例
    p1: P1 高优先级用例
    p2: P2 一般优先级用例
    auth: 认证相关测试
    crm: CRM API 测试
    security: 安全测试
    content: 内容 API 测试
    agent: Agent API 测试
filterwarnings =
    ignore::DeprecationWarning
